services:
  - type: worker
    name: onyxenv-bot-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        value: 8531959574:AAFxoDFV5CE7e0yyEHBwxCssWfrsXkBZgqU
    plan: free

  - type: web
    name: onyxenv-bot-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn bot:app
    envVars:
      - key: BOT_TOKEN
        value: 8531959574:AAFxoDFV5CE7e0yyEHBwxCssWfrsXkBZgqU
    plan: free
